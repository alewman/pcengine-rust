[package]
name = "pcengine-rust"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "A Rust PC Engine / TurboGrafx-16 board transcribed from, and proven equivalent to, pcengine-python"
license = "MIT"
repository = "https://github.com/alewman/pcengine-rust"
readme = "README.md"
publish = false

[lib]
name = "pcengine_rust"

[dependencies]
# huc6280-rust (crate huc6280) at e1d24a3 (the clean rewrite of 2026-11-19, transcribed from
# huc6280-python 6ce348e, the revision the reference pcengine-python 3318027 pins), by git
# revision on GitHub (pushed 2026-11-20; by path from a sibling clone before that). To build
# against a local checkout of the core instead, without editing this file:
#   cargo build --config 'patch."https://github.com/alewman/huc6280-rust".huc6280-rust.path="../huc6280-rust"'
huc6280 = { package = "huc6280-rust", git = "https://github.com/alewman/huc6280-rust", rev = "1bb840db54a4ccae823a5109e3e98e4d2bb8023c" }  # 1bb840d: its history reset (2026-11-21), e1d24a3's core
# Save states (src/state.rs) and the card's identity in them.
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
flate2 = "1"
sha1 = "0.10"

[profile.release]
debug = 1
