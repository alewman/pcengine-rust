[package]
name = "pcengine-rust"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "A Rust PC Engine / TurboGrafx-16 board transcribed from, and proven equivalent to, pcengine-python"
license = "MIT"
repository = "https://github.com/alewman/pcengine-rust"
readme = "README.md"
publish = false

[lib]
name = "pcengine_rust"

[dependencies]
# huc6280-rust (crate huc6280) at e1d24a3 (the clean rewrite of 2026-11-19, transcribed from
# huc6280-python 6ce348e, the revision the reference pcengine-python 3318027 pins). Not on
# GitHub yet, so a path to a sibling clone checked out at that commit; once it is pushed this
# becomes the git pin:
#   huc6280 = { package = "huc6280-rust", git = "https://github.com/alewman/huc6280-rust", rev = "e1d24a395743779d5fa13aa70e7590f4821345f3" }
huc6280 = { package = "huc6280-rust", path = "../huc6280-rust" }
# Save states (src/state.rs) and the card's identity in them.
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
flate2 = "1"
sha1 = "0.10"

[profile.release]
debug = 1
